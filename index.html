<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Libra Labs. Pictures, comics, prints, and commissions."
    />
    <title>Libra Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("libra-theme") || "dark";
          var r =
            localStorage.getItem("libra-age") === "adult"
              ? localStorage.getItem("libra-rating") || "nsfw"
              : "sfw";
          if (t !== "lite" && t !== "dark") t = "dark";
          if (r !== "sfw" && r !== "nsfw") r = "sfw";
          document.documentElement.dataset.theme = t;
          document.documentElement.dataset.rating = r;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.rating = "sfw";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
